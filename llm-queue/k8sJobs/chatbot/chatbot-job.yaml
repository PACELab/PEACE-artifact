apiVersion: v1
kind: Pod
metadata:
  name: chatbot-job
  namespace: ls
  labels:
    app: chatbot

spec:
  containers:
  - name: chatbot
    image: nba556677/chatbot:vllm
    #imagePullPolicy: Always
    command: ["python", "-m", "vllm.entrypoints.openai.api_server", "--model", "facebook/opt-6.7b", "--gpu-memory-utilization", "0.75"]
    ports:
    - containerPort: 8000
    env:
    - name: GPU_MEMORY
      value: "18841"
    - name: GPU_COMPTIME
      value: "63"
    - name: CPU_COMPTIME
      value: "756"
    resources:
      limits:
        # MiB
         aliyun.com/gpu-mem: 18841
  restartPolicy: Never

